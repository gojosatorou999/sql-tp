<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker | Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Expense Tracker</h1>
            <p>Smartly tracking your finances.</p>
        </header>

        <section class="stats-section">
            <div class="stat-card total-spending">
                <h3>Total Spending</h3>
                <span id="total-amount">₹0.00</span>
            </div>
            <div class="breakdown-card">
                <h3>Category Breakdown</h3>
                <div id="breakdown-list"></div>
            </div>
        </section>

        <section class="form-section">
            <form id="expense-form">
                <input type="number" step="0.01" id="amount" placeholder="Amount (e.g. 500.00)" required>
                <select id="category" required>
                    <option value="" disabled selected>Category</option>
                    <option value="Food">🍔 Food</option>
                    <option value="Travel">🚗 Travel</option>
                    <option value="Health">💊 Health</option>
                    <option value="Shopping">🛍️ Shopping</option>
                    <option value="Bills">🧾 Bills</option>
                    <option value="Other">✨ Other</option>
                </select>
                <button type="submit" id="add-btn">Add Expense</button>
            </form>
        </section>

        <section class="list-section">
            <div class="list-header">
                <h3>Recent Expenses</h3>
                <span id="expense-count">0 items</span>
            </div>
            <div class="expenses-list" id="expenses-list">
                <!-- Expenses will be populated here -->
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
